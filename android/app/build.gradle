apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// ------------------- React Native Config -------------------
// Hermes is switched on by hermesEnabled=true in gradle.properties.
react {
    // No hermesCommand: the plugin picks node_modules/hermes-compiler/hermesc/<os>-bin/hermesc for the
    // machine building (macOS, Linux or Windows), so release bundles are compiled to Hermes bytecode.
    hermesFlags = ["-O"]
    // This ensures autolinking works
    autolinkLibrariesWithApp()
}

// ------------------- Icon fonts -------------------
// The app only uses react-native-vector-icons/Ionicons, so only Ionicons.ttf is copied from node_modules
// into the APK (the other 18 icon fonts are about 5 MB). Add a file here before using another icon set.
// The Inter text fonts live in src/main/assets/fonts.
project.ext.vectoricons = [
    iconFontNames: ["Ionicons.ttf"]
]
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

// ------------------- Android Build Config -------------------
android {
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    namespace "com.worknestmobile"

    defaultConfig {
        applicationId "com.worknestmobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 21
        versionName "0.0.21"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists() &&
                keystoreProperties["MYAPP_UPLOAD_STORE_FILE"] &&
                keystoreProperties["MYAPP_UPLOAD_STORE_PASSWORD"] &&
                keystoreProperties["MYAPP_UPLOAD_KEY_ALIAS"] &&
                keystoreProperties["MYAPP_UPLOAD_KEY_PASSWORD"]) {
                storeFile file(keystoreProperties["MYAPP_UPLOAD_STORE_FILE"])
                storePassword keystoreProperties["MYAPP_UPLOAD_STORE_PASSWORD"]
                keyAlias keystoreProperties["MYAPP_UPLOAD_KEY_ALIAS"]
                keyPassword keystoreProperties["MYAPP_UPLOAD_KEY_PASSWORD"]
            } else {
                // Fallback to debug signing when keystore.properties is missing
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            // R8 shrinks and obfuscates the Java/Kotlin code; keep rules are in proguard-rules.pro.
            minifyEnabled true
            // Drops unused Android resources. Images bundled from JS are looked up by name at run time, so
            // src/main/res/raw/keep.xml keeps them.
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// ------------------- Dependencies -------------------
dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
